syntax = "proto3";

package fuseos.v1;

// Naming only — these affect generated symbol names, never the wire format.
// Java:  com.fuseos.proto.Envelope     Swift: FuseEnvelope
option java_package = "com.fuseos.proto";
option java_multiple_files = true;
option swift_prefix = "Fuse";

// Source of truth for the FuseOS device-to-device (LAN data plane) wire format.
// Every platform generates its own bindings from this file. See docs/protocol.md.
//
// RULES:
//  - Tag numbers are PERMANENT. Add fields; never renumber or reuse a tag.
//  - Every event MUST carry source_device_id + session_id + seq (loop prevention & dedupe).
//  - No control-plane / auth concerns live here — this is data plane only.

// Wraps every message on the LAN channel.
message Envelope {
  string source_device_id = 1; // device that originated this event
  uint64 seq               = 2; // monotonic per source device, WITHIN one session
  int64  sent_at_unix_ms   = 3;
  // Random per app launch. `seq` restarts at zero whenever a device's process does —
  // constant on Android, where the OS kills apps freely — so (source_device_id, seq)
  // alone cannot tell a restarted counter from a replayed event, and a receiver that
  // guessed wrong either dropped everything from that peer until it restarted too, or
  // lost its replay protection. This field removes the guess.
  string session_id        = 4;

  oneof body {
    ClipText  clip_text  = 10;
    ClipImage clip_image = 11;
    FileMeta  file_meta  = 12;
    FileChunk file_chunk = 13;
    Ack       ack        = 14;
    Heartbeat heartbeat  = 15;
    FileCancel file_cancel = 16;
    PhoneNotification phone_notification = 17;
    NotificationDismiss notification_dismiss = 18;
    HistorySync history_sync = 19;
    ScreenControl screen_control = 20;
    ScreenFrame screen_frame = 21;
    RemoteInput remote_input = 22;
    PhoneCommand phone_command = 23;
    OpenLink open_link = 24;
    MediaState media_state = 25;
    MediaCommand media_command = 26;
    PointerInput pointer_input = 27;
    NotificationReply notification_reply = 28;
    CallState call_state = 29;
    CallAction call_action = 30;
    SidecarControl sidecar_control = 31;
    ScreenFrame sidecar_frame = 32; // Mac -> phone: a frame of the Mac's extra display
    SidecarInput sidecar_input = 33;
    DeviceStatus device_status = 34;
    BeaconKey beacon_key = 35;
    Unlocked unlocked = 36;
    NotificationOpen notification_open = 37;
    Outcome outcome = 38;
    BeaconCheck beacon_check = 39;
  }
}

message ClipText {
  string text = 1; // UTF-8
}

message ClipImage {
  string mime  = 1; // e.g. "image/png"
  bytes  data  = 2; // small images inline; large images use FileChunk streaming
}

message FileMeta {
  string transfer_id = 1;
  string name        = 2;
  uint64 size        = 3;
  string mime        = 4;
  string checksum    = 5; // e.g. sha-256 hex, verified on receipt
}

message FileChunk {
  string transfer_id = 1;
  uint64 index       = 2; // ordered
  bytes  data        = 3;
  bool   last        = 4;
}

message Ack {
  string ref_transfer_id = 1; // for file transfers
  uint64 ref_seq         = 2; // for clipboard events
}

message Heartbeat {}

// Either end of a transfer giving up: the sender cancelled or could not read the file,
// or the receiver cancelled, failed a write, or failed verification. The other end stops
// and discards. Without it a cancelled send left the receiver's partial file waiting
// forever, and a rejected one left the sender waiting for an ack that never came.
message FileCancel {
  string transfer_id = 1;
}

// A notification posted on the phone, mirrored to the Mac. The phone is the only origin:
// the Mac shows it and never re-emits one, so there is nothing here that can loop.
// Posting again with the same `key` replaces the earlier one (a chat's next message).
message PhoneNotification {
  string key               = 1; // Android's StatusBarNotification key
  string package           = 2;
  string app_name          = 3;
  string title             = 4;
  string text              = 5;
  bytes  icon_png          = 6; // the app's icon, small; may be empty
  int64  posted_at_unix_ms = 7;
  bool   can_reply         = 8; // the app offers an inline reply (a chat, an SMS)
  // A live activity: an ongoing notification that is really an activity (a timer, a
  // navigation, a delivery, a download) rather than a background service's placard. The
  // Mac shows these in a live panel, updated in place, never as a banner.
  bool   ongoing           = 9;
  int32  progress          = 10;
  int32  progress_max      = 11; // 0 = no progress bar
  bool   indeterminate     = 12;
}

// A mirrored notification went away. The phone sends it when one is removed there; the
// Mac sends it when the user dismisses it there, and the phone then clears it too.
message NotificationDismiss {
  string key = 1;
}

// Sent once each time a channel comes up: the sender's recent clipboard history, so two
// devices converge on what was copied while they were apart. Applied to history only —
// never to the clipboard — and never answered with another HistorySync.
message HistorySync {
  repeated HistoryItem items = 1;
}

message HistoryItem {
  string text       = 1; // set for text entries
  string image_mime = 2; // set, with image_data, for image entries
  bytes  image_data = 3;
  int64  at_unix_ms = 4; // when it was first copied
}

// Screen mirroring control. Mac -> phone: START asks to begin (the phone asks its user
// for consent), STOP ends it, KEYFRAME asks for a fresh keyframe after a gap. Phone -> Mac:
// START once frames are about to flow, STOP when mirroring ended on the phone.
message ScreenControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    START              = 1;
    STOP               = 2;
    KEYFRAME           = 3;
  }
  Action action = 1;
  // Phone -> Mac, with START: the phone will act on RemoteInput (its remote-control
  // accessibility service is on). False means view only.
  bool remote_control = 2;
}

// One H.264 access unit of the phone's screen, Annex-B framed. The codec config
// (SPS + PPS) is sent as its own frame with `config` set, before the first keyframe and
// whenever the size changes.
message ScreenFrame {
  bytes  data     = 1;
  bool   keyframe = 2;
  bool   config   = 3;
  uint32 width    = 4;
  uint32 height   = 5;
  int64  pts_us   = 6;
}

// Mac -> phone while the phone's screen is mirrored: one input for the phone to perform
// through its remote-control accessibility service. Positions are 0–1 of the mirrored
// image, because that is all the Mac knows of the phone's screen. The phone ignores every
// RemoteInput unless it is sharing its screen at that moment.
message RemoteInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TAP              = 1; // at (x, y)
    SWIPE            = 2; // (x, y) -> (x2, y2) over duration_ms
    LONG_PRESS       = 3; // at (x, y)
    BACK             = 4;
    HOME             = 5;
    RECENTS          = 6;
    TEXT             = 7; // text typed into the focused field
    KEY              = 8; // key_code: an Android KeyEvent code (DEL = 67, ENTER = 66)
  }
  Kind   kind        = 1;
  float  x           = 2;
  float  y           = 3;
  float  x2          = 4;
  float  y2          = 5;
  uint32 duration_ms = 6;
  string text        = 7;
  uint32 key_code    = 8;
}

// Mac -> phone: something for the phone to do.
//  RING       - play a loud alarm, even on silent, until STOP_RING, a tap on its
//               notification, or 30 s (Find My, for a phone lost in the sofa).
//  3 was TAKE_PHOTO (Continuity Camera), removed on 2026-09-28; reserved, never reuse.
message PhoneCommand {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    RING               = 1;
    STOP_RING          = 2;
    reserved 3;
    reserved "TAKE_PHOTO";
  }
  Action action = 1;
}

// Either direction: open this http(s) link on the receiving device (Handoff). The
// receiver opens only http and https, never another scheme.
message OpenLink {
  string url = 1;
}

// Phone -> Mac: what the phone is playing (Now Playing), sent when it changes and when a
// Mac connects. active = false means nothing is playing any more.
message MediaState {
  bool   active       = 1;
  string app_name     = 2;
  string title        = 3;
  string artist       = 4;
  string album        = 5;
  bool   playing      = 6;
  int64  position_ms  = 7; // at position_at_unix_ms; the Mac advances it while playing
  int64  duration_ms  = 8; // 0 when unknown (a live stream)
  bytes  artwork_jpeg = 9; // small; may be empty
  int64  position_at_unix_ms = 10;
}

// Mac -> phone: control what the phone is playing.
message MediaCommand {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    PLAY_PAUSE         = 1;
    NEXT               = 2;
    PREVIOUS           = 3;
    SEEK               = 4; // to position_ms
  }
  Action action      = 1;
  int64  position_ms = 2;
}

// Phone -> Mac: the phone as the Mac's trackpad and keyboard. The Mac acts on these only
// while the user has turned "Let your phone control this Mac" on, and macOS has granted it
// Accessibility access.
message PointerInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    MOVE             = 1; // by (dx, dy) points
    CLICK            = 2;
    RIGHT_CLICK      = 3;
    DOUBLE_CLICK     = 4;
    SCROLL           = 5; // by (dx, dy) points
    DRAG_START       = 6; // press and hold the button; MOVEs drag until DRAG_END
    DRAG_END         = 7;
    TEXT             = 8; // text typed at the focused field
    KEY              = 9; // key_code: a Mac virtual key code (return 36, delete 51, tab 48,
                          // escape 53, arrows 123-126), with modifiers
  }
  Kind   kind      = 1;
  float  dx        = 2;
  float  dy        = 3;
  string text      = 4;
  uint32 key_code  = 5;
  uint32 modifiers = 6; // bitmask: 1 command, 2 shift, 4 option, 8 control
}

// Mac -> phone: reply to a mirrored notification that can_reply. The phone fills the
// app's own inline-reply action with this text, as if typed in the shade — which is how
// SMS and chat replies work without FuseOS holding any SMS permission.
message NotificationReply {
  string key  = 1;
  string text = 2;
}

// Phone -> Mac: a phone call's progress, read from the dialer's call notification.
message CallState {
  enum State {
    STATE_UNSPECIFIED = 0;
    RINGING           = 1; // incoming, not yet answered
    ACTIVE            = 2; // in progress (answered, or outgoing)
    ENDED             = 3;
  }
  State  state  = 1;
  string key    = 2; // the call notification's key; one call = one key
  string caller = 3; // name, or number when the contact is unknown
}

// Mac -> phone: answer, decline or hang up. Call audio stays on the phone (the Mac is not
// a Bluetooth headset), so answering from the Mac also turns the phone's speaker on.
message CallAction {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ANSWER             = 1;
    DECLINE            = 2; // an incoming call
    END                = 3; // an active call
  }
  Action action = 1;
}

// Sidecar: the phone as a second display for the Mac.
// Phone -> Mac: START asks the Mac to add a display the shape of the phone's screen
// (width x height pixels, landscape, at dpi); STOP removes it. Mac -> phone: START once
// frames are about to flow; STOP when the Mac ended it (or could not start: no Screen
// Recording permission). KEYFRAME (phone -> Mac) asks for a fresh keyframe after a gap.
message SidecarControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    START              = 1;
    STOP               = 2;
    KEYFRAME           = 3;
  }
  Action action = 1;
  uint32 width  = 2;
  uint32 height = 3;
  uint32 dpi    = 4;
}

// Phone -> Mac: a touch on the Sidecar display, at 0–1 of that display (top-left origin).
// The Mac acts on these only with Accessibility access.
message SidecarInput {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TAP              = 1;
    DOWN             = 2; // a drag begins
    MOVE             = 3; // the drag continues
    UP               = 4; // the drag ends
    SCROLL           = 5; // by (dx, dy) points, at (x, y)
    RIGHT_CLICK      = 6;
  }
  Kind  kind = 1;
  float x    = 2;
  float y    = 3;
  float dx   = 4;
  float dy   = 5;
}

// Either direction: this device's battery, sent when a channel comes up and whenever it
// changes. Live over the LAN, so a charger plugged in shows on the other device at once
// (the server's presence battery is the fallback when there is no channel).
message DeviceStatus {
  int32 battery  = 1; // 0–100; -1 when the device has no battery (a desktop Mac)
  bool  charging = 2;
  // Mac -> phone: the Mac will act on POINTER_INPUT — its "Let your phone control this
  // Mac" switch is on and macOS granted Accessibility. The phone's trackpad says so
  // instead of sending input into nothing. Sent again whenever either changes.
  bool  pointer_allowed = 3;
}

// Mac -> phone, on every new channel: a fresh random key for the phone's Bluetooth
// beacon. The phone advertises HMAC-SHA256(key, unix_time / 600) truncated to 8 bytes as
// manufacturer data, so only this Mac can recognise it and the value changes every ten
// minutes — nobody else can track the phone by it.
message BeaconKey {
  bytes key = 1; // 16 random bytes
}

// Either direction: "I was just unlocked by my user." The phone sends it on unlock, and
// the Mac — when it is locked, the phone is close by Bluetooth, and the user opted in —
// unlocks. The Mac sends it on unlock, and the phone wakes its screen (an app cannot get
// past the phone's own lock).
message Unlocked {}

// Mac -> phone: "Bluetooth says you are far — prove it." Sent over the LAN link, which is
// steadier than the beacon, before the Mac locks. The phone beacons at full power for a
// few seconds and answers with the same message, saying whether its beacon is on; the
// Mac locks only if it is and it still hears the phone far or not at all. A beacon the
// OS throttled on a phone lying next to the Mac comes back strong and nothing locks.
message BeaconCheck {
  bool broadcasting = 1; // phone -> Mac only
}

// Mac -> phone: the user clicked a mirrored notification; open it on the phone, as a tap
// in the shade would (its app's own content intent).
message NotificationOpen {
  string key = 1;
}

// Either direction: what became of something the other device asked for — a reply, an
// opened notification, an unlock — so the asker's island can say so instead of assuming.
// `detail` is a short sentence for a person (why it failed, what to do), shown as-is.
message Outcome {
  enum Kind {
    KIND_UNSPECIFIED  = 0;
    REPLY             = 1;
    OPEN_NOTIFICATION = 2;
    UNLOCK            = 3;
    OPEN_LINK         = 4;
    CALL              = 5; // answer / decline / end, as the Mac asked
  }
  Kind   kind   = 1;
  bool   ok     = 2;
  string detail = 3;
}
