name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Format · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager; naming one here as well
      # makes the action refuse to run.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The native apps build with their own toolchains, outside PNPM. Without these jobs
  # nothing checked that either app still compiled or that its unit tests passed — the
  # macOS suite cannot even run on a Mac without Xcode.
  android:
    name: Android · build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  macos:
    name: macOS · build + unit tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@v4
      # The app uses macOS 26 APIs (Liquid Glass), so it needs the newest Xcode on the
      # image rather than the default.
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Protobuf toolchain
        run: brew install protobuf swift-protobuf
      - name: Generate bindings
        run: |
          mkdir -p Sources/FuseOSCore/Generated
          protoc --swift_out=Sources/FuseOSCore/Generated --proto_path=../../proto ../../proto/fuseos.proto
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
