name: Release

# Push a tag like v0.2.0 and this builds the signed APK and DMG, pointed at the hosted
# server, and publishes them as a GitHub release. The website downloads from the latest
# release, so a release is also a website update.
#
# Needs (repo settings):
#   variable FUSE_SERVER_URL         the hosted server, https://… (deploy/README.md)
#   secret   ANDROID_KEYSTORE_B64    base64 of the release keystore (alias "fuseos")
#   secret   ANDROID_KEYSTORE_PASSWORD
#   secret   MAC_SIGNING_P12_B64     base64 of the "FuseOS Local Signing" identity (.p12)
#   secret   MAC_SIGNING_P12_PASSWORD
# The same keystore and identity must sign every release, or updates will not install
# over each other (Android) and permissions reset (macOS).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - name: Server URL is set
        run: test -n "${{ vars.FUSE_SERVER_URL }}" || { echo "::error::set the repo variable FUSE_SERVER_URL"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          FUSE_KEYSTORE: ${{ runner.temp }}/release.jks
          FUSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PserverUrl="${{ vars.FUSE_SERVER_URL }}" \
            -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/FuseOS.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: FuseOS.apk

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Protobuf toolchain
        run: brew install protobuf swift-protobuf
      - name: DMG
        env:
          FUSE_SERVER_URL: ${{ vars.FUSE_SERVER_URL }}
          FUSE_VERSION: ${{ github.ref_name }}
          FUSE_BUILD: ${{ github.run_number }}
          FUSE_SIGN_P12: ${{ secrets.MAC_SIGNING_P12_B64 }}
          FUSE_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          export FUSE_VERSION="${FUSE_VERSION#v}"
          test -n "$FUSE_SIGN_P12" || { echo "::error::set MAC_SIGNING_P12_B64"; exit 1; }
          ./make-dmg.sh
          cp .build/FuseOS.dmg "$GITHUB_WORKSPACE/FuseOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: FuseOS.dmg

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a dash (v1.1.0-rc.1) is a pre-release: never "latest", so the website's
        # Download buttons keep the last real version, and no email (below).
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease --latest=false" ;; esac
          gh release create "$GITHUB_REF_NAME" FuseOS.apk FuseOS.dmg --repo "$GITHUB_REPOSITORY" --generate-notes $flags
      # Emails everyone on the release list (Inngest `releases-announce` → a Resend Broadcast).
      # The tag is the event id, so a re-run cannot email twice; pre-releases (v1.1.0-beta) stay quiet.
      - name: Release email
        env:
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
        run: |
          # Only a plain vX.Y.Z tag emails anyone (it also goes into the JSON below).
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a plain release tag: no email"; exit 0; }
          test -n "$INNGEST_EVENT_KEY" || { echo "::notice::secret INNGEST_EVENT_KEY not set: no release email"; exit 0; }
          curl -fsS -X POST "https://inn.gs/e/$INNGEST_EVENT_KEY" -H 'content-type: application/json' \
            -d "{\"name\":\"releases/published\",\"id\":\"release-$GITHUB_REF_NAME\",\"data\":{\"version\":\"${GITHUB_REF_NAME#v}\",\"notesUrl\":\"https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME\"}}"
